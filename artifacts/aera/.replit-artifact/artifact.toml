kind = "mobile"
previewPath = "/cognisafe-q/"
title = "Cognisafe-Q"
description = "A calm, glanceable vehicular safety companion that monitors motion during trips, detects possible incidents, and escalates to emergency contacts when the driver cannot respond."
version = "1.0.0"
id = "artifacts/cognisafe-q"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/cognisafe-q/" ]
localPort = 20336

[services.development]
run = "pnpm --filter @workspace/cognisafe-q run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cognisafe-q", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cognisafe-q", "run", "serve" ]

[services.env]
PORT = "20336"
BASE_PATH = "/cognisafe-q/"
